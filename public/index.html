<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribble Cloud - Arnya Behl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#0f111a',
                        'glass-bg': 'rgba(255, 255, 255, 0.05)',
                        'accent': '#6c5ce7'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-white h-screen overflow-hidden flex flex-col lg:flex-row p-4 gap-4">

    <!-- Sidebar Tools -->
    <nav class="lg:w-20 w-full h-auto lg:h-full bg-glass-bg backdrop-blur-lg border border-white/10 rounded-2xl flex lg:flex-col items-center justify-around py-4 lg:py-8 gap-6 z-50">
        <div class="hidden lg:block text-2xl">☁️</div>
        <div class="flex lg:flex-col gap-4 items-center">
            <!-- Color Picker -->
            <input type="color" id="rang_box" value="#a29bfe" class="w-10 h-10 bg-transparent cursor-pointer">
            
            <!-- Tool Buttons -->
            <button id="pencil_btn" class="w-12 h-12 rounded-xl bg-accent flex items-center justify-center text-xl shadow-lg"><i class="fas fa-pencil-alt"></i></button>
            <button id="magic_btn" class="w-12 h-12 rounded-xl bg-gray-800 flex items-center justify-center text-xl"><i class="fas fa-magic"></i></button>
            <button id="eraser_btn" class="w-12 h-12 rounded-xl bg-gray-800 flex items-center justify-center text-xl"><i class="fas fa-eraser"></i></button>
        </div>
        
        <!-- Brush Size Section -->
        <div class="flex flex-col items-center gap-2">
            <input type="range" id="size_slider" min="1" max="100" value="10" class="w-16 lg:w-full h-1 accent-accent">
            <span id="size_label" class="text-xs text-accent">10%</span>
        </div>

        <a href="https://github.com/arnya21" target="_blank" class="hidden lg:block text-2xl text-gray-500 hover:text-white transition"><i class="fab fa-github"></i></a>
    </nav>

    <!-- Canvas Area -->
    <main class="flex-1 flex flex-col gap-4 min-h-0">
        <header class="h-16 bg-glass-bg border border-white/10 rounded-2xl flex items-center justify-between px-6">
            <div class="flex items-center gap-2"><i class="fas fa-user-circle"></i> <span id="display_name">Arnya</span></div>
            <div class="text-gray-400 text-sm">Live | AWS-EC2 <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block animate-pulse"></span></div>
        </header>
        <div class="flex-1 bg-white rounded-3xl border-4 border-accent relative overflow-hidden shadow-2xl">
            <canvas id="board" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>
        </div>
    </main>

    <!-- Chat Area -->
    <aside class="lg:w-80 w-full lg:h-full h-40 bg-glass-bg border border-white/10 rounded-2xl flex flex-col">
        <div class="p-3 border-b border-white/10 text-center text-xs font-bold uppercase tracking-widest text-gray-500">Guess & Chat</div>
        <div id="messages_box" class="flex-1 overflow-y-auto p-4 space-y-2 flex flex-col"></div>
        <div class="p-4 flex gap-2">
            <input type="text" id="inp_msg" placeholder="Guess something..." class="flex-1 bg-gray-800 border border-white/10 rounded-lg px-3 py-2 text-sm outline-none">
            <button onclick="messageBhejo()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </aside>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
